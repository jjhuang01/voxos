# VoxOS 全局配置（TOML：Python 3.11+ 标准库 tomllib 解析，零第三方依赖）
# 规范文档中的 settings.yaml 字段与此处一一对应；改这里不需要改代码。

[audio]
sample_rate = 16000
chunk_size = 512              # 32ms @16kHz
input_device = ""             # "" = 系统默认；也可写设备名片段（如 "MacBook"）或索引（如 "1"）
                              # 本机的默认输入可能是个没插东西的音频接口：录得到帧、峰值恒 0。
                              # `voxos doctor` 的「输入设备」那行会报设备名和实测电平。
vad_threshold = 0.5
vad_backend = "auto"          # auto | silero | energy（auto：有模型用 silero，否则能量 VAD）
silero_model = ".voxos/models/silero_vad.onnx"
speaker_model = ".voxos/models/campplus.onnx"   # CAM++ 声纹模型；缺失则降级频谱声纹
silence_duration_ms = 500     # 静音超过此值 → 进入「候选端点」，开始问「说完了吗」
                              # 旧值 800：从最后一个字到开始处理白等 0.8s，比豆包/ChatGPT
                              # 慢一倍多。降噪靠语义尾词判断兜住，不是靠等更久。
endpoint_extend_ms = 2500     # 候选端点发现「没说完」（结尾是「然后」「比如」…）时，
                              # 再多等这么久。这是「断断续续说」的容忍窗口：
                              # 短了会抢话，长了会显得迟钝。OpenAI 的 eagerness 就是这个东西。
prefix_padding_ms = 300       # 判出人声时，往前补这么多音频。VAD 逐块判，第一个音素
                              # 往往落在上一块里——不补就把「嗯」「把」这类轻声起头削掉。
partial_window_ms = 3000      # 判「说完没」只解最后这么久。离线解码耗时随长度线性涨
                              # （实测 2s→68ms，12s→283ms），而判断只看结尾。
subtitles = true              # 边说边出字：胶囊第二行实时显示「已经听到的半句」。
                              # 远端识别后端一律不给（字幕必须在声纹校验之前出字，
                              # 等于把没验过身份的音频提前传上云）。
subtitle_interval_ms = 400    # 出过一次字之后，每这么久刷新一次
subtitle_window_ms = 2500     # 窗口字幕只解最后这么久：成本是常数，长句不退化
                              # （实测 2.5s 音频 ≈ 67ms，每 400ms 一次）
first_partial_ms = 250        # 首字阈值，比后续刷新更快。两者是两件事：前者决定
                              # 「觉不觉得它听见了」，后者只是可读性。
max_utterance_ms = 12000      # 单句硬上限，防止一直说不停
min_speech_ms = 200           # 真实人声短于此视为噪音（按人声时长算，不含 prefix padding）
turn_backend = "auto"         # auto | smart | text。auto：有模型用 smart-turn，否则文本判停
turn_model = ".voxos/models/smart-turn-v3.2-cpu.onnx"   # 8.7MB int8，`voxos models` 下载
turn_threshold = 0.5          # 上游的「说完了」门槛。我们**没有**拿它当主判据，见下一行
turn_veto = 0.2               # 只否决、不拍板：概率低于它才推迟收尾，其余交给文本判据。
                              # 为什么不用 0.5 当主判据：6 句完整的中文指令里有 4 句低于
                              # 0.5（「今天下午三点提醒我开会」0.27、「把刚才那段话翻译成
                              # 英文」0.42），照抄会让三分之一的正常指令多等 2.5 秒。
                              # 那批音频是系统 TTS 合成的，不代表真人语调——所以既不下结论
                              # 说模型不行，也不拿它去赌。真人录音量出 TPR/TNR 之后再动。
turn_threads = 1              # 模型推理线程数；10–65ms 的任务，1 个线程够，多了抢 VAD 的核
voiceprint_threshold = 0.75   # 实测标定：录 3 句取均值后，真麦克风同人最低 0.786 / 异人最高 0.715
                              # 旧值 0.82 的问题：只录 1 句时同人换句话只有 0.751，等于录完就被自己拒
                              # 对照：合成语料下 0.76 时 FAR 1.67%，0.86 时 FRR 8.3%（见 docs/ACCEPTANCE.md）
                              # 两个语料的最优阈值不重合：合成语料要 ≥0.80，真麦克风要 ≤0.78。
                              # 这是通道差异，不是调参能解决的——见 TODO_ROADMAP「声纹阈值按通道标定」
voiceprint_threshold_fallback = 0.45   # 降级频谱声纹的独立阈值（尺度不同）
voiceprint_profiles = ".voxos/voiceprint_profiles.npz"
mask_mode = false             # 静音面罩/低语补偿
agc_target_dbfs = -3.0
echo_decay_ms = 300           # TTS 结束后的混响消退期
interrupt_ms = 500            # 播报中「人声持续多久」才算打断（对齐 LiveKit 的
                              # min_interruption_duration）。不要求用户喊特定词：
                              # 「等一下，我说的是另一个」也算。判定还要过声纹——
                              # 自己的 TTS 回声能量够但音色不像本人，会被挡住。
hotwords_path = "config/hotwords.txt"
hotwords_generated = "config/hotwords.txt.generated"
hotwords_max = 2000
wake_words = ["siri", "jarvis", "小助手", "嘿 siri"]

[stt]
backend = "scripted"          # scripted | sense_voice | local_whisper | openai
model_dir = ".voxos/models/sense-voice"   # sense_voice 用：model.int8.onnx + tokens.txt
stream_model_dir = ""         # 流式识别模型目录（sherpa-onnx zipformer / paraformer）。
                              # 留空 = 用「窗口字幕」：拿上面那个离线引擎反复解最后 2.5s。
                              # 不需要任何新模型，本机现在就能跑；代价是长句开头会滚掉。
                              # 填了目录就换真流式：前缀不丢、长句不退化、支持热词。
                              # 模型：sherpa-onnx-streaming-zipformer-bilingual-zh-en-2023-02-20
num_threads = 2               # sense_voice 推理线程数；2 核够跑实时，再多收益递减
language = "zh"
model = "small"
api_base = ""
api_key = ""
timeout_s = 30

[llm]
enabled = true                # 慢通道总开关。关掉 = 只走正则快通道 + 离线启发式，完全离线可用
provider = "cline"            # cline | openai | ollama。决定要不要注入渠道私有字段（见 core._llm_extra）
base_url = "https://llm.mindax.cn/v1"
api_key = ""                  # 留空则读 api_key_file（默认 .voxos/llm_key）；环境变量 VOXOS_LLM_API_KEY 最优先
api_key_file = ".voxos/llm_key"   # 独立文件，不进仓库：填一次密钥不该等于往公开仓库推一次
model = "cline-pass/deepseek-v4.1-flash-1017"
                              # 必须带 cline-pass/ 前缀：裸 deepseek/* 走付费层，余额 0 时 402
thinking = "disabled"         # disabled | enabled | auto。Cline 渠道必须 disabled：
                              # 否则 DeepSeek V4 会把思考链混进 tool_call 参数流，结构化调用直接失败
temperature = 0.1
timeout_s = 20
max_tool_rounds = 3           # agent 循环上限：一轮 tool_calls + 回填结果算一轮
prompts_dir = "config/prompts"        # 随包提示词（升级会换掉）
user_prompts_dir = ".voxos/prompts"   # 你自己的覆盖版（升级不丢，存盘即生效）
extra_body = ""               # 其它渠道私有字段，JSON 字符串，如 '{"reasoning_effort":"low"}'

[tts]
provider = "say"              # say | doubao。**默认 say**：没买接口的机器行为一个字都不变
# 豆包语音合成 2.0（火山引擎）。接口形状来自官方文档《HTTP Chunked/SSE 单向流式-V3》
api_key = ""                  # 新版控制台：填这一项就够
app_id = ""                   # 旧版控制台：app_id + access_key 两个都要
access_key = ""
resource_id = "seed-tts-2.0"  # 决定模型版本与计费商品；声音复刻是 seed-icl-2.0
speaker = "zh_female_shuangkuaisisi_moon_bigtts"
sample_rate = 24000           # 必须和播放端一致；改这里不用改代码
timeout_s = 8                 # 同时管连接与读：首字节迟迟不来会抛超时 → 退回系统 say
uid = "voxos"                 # 请求体里的 user.uid，服务端用来算用量归属

[workspace]
daily_log_dir = "~/Documents/DevLogs"
default_code_dir = "~/Projects"
ide_command = "code"
code_cli = "claude"           # 编程会话内执行的 CLI：claude | aider | codex
grafana_url = ""              # 说“看看监控”时打开的看板地址，留空则不打开
backup_dir = ".voxos_backup"
dry_run = false               # true = 不真的派发 tmux/IDE/浏览器，只打印将执行的命令
allow_outside_roots = false   # true = 允许读写工作区外的绝对路径（等于放弃工作区边界）
role = "DEVELOPER"            # DEVELOPER | OPS | DOCTOR
log_template = "- **[{time}] [{category}]** ({project}) {content}"
confirm_timeout_s = 8
sandbox = "workspace-write"   # 命令沙箱：read-only | workspace-write | danger-full-access
network = false               # 沙箱里的命令能否联网（默认不能：别在你不知道的时候往外发东西）
# 沙箱额外允许写入的目录。上面两个根 + 启动目录（cwd）+ 临时目录已经默认放行，
# 所以这里只用来补「我还有个别的项目目录」这种例外。别写 "/" 或 "~"：
# 那两个等于不设边界，代码里会直接把整个 profile 变成全开。
write_roots = []
command_timeout_s = 60        # 单条命令的超时上限
schedule_file = ".voxos/schedules.json"  # 定时任务表，删掉就等于清空

[ui]
host = "127.0.0.1"
port = 8765
earcons = true
speak = true                  # 完成后用系统 TTS 念一遍结果
pill_file = "web/pill.html"

[audit]
enabled = true
path = ".voxos/audit.jsonl"
