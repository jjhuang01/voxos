# 安全红线配置（数据驱动：改策略不需要改代码）
# 详见 REDLINES.md。所有正则以 IGNORECASE 匹配「工具名 + 序列化参数」的全文。

forbidden = [
  'rm\s+-rf\s+(/|~|\*|\$HOME)',
  'drop\s+(database|table|schema)',
  'truncate\s+table',
  'git\s+push\s+.*(--force|-f)\b',
  'git\s+reset\s+--hard',
  'shutdown|reboot|init\s+0|halt',
  'mkfs|dd\s+if=.*of=/dev/',
  'chmod\s+-R\s+777\s+/',
  'submit_final_prescription',
  'delete_patient_record',
  '>\s*/dev/sd[a-z]',
]

# 「不可逆动作」词表：工具本身是 YELLOW，但只要参数里出现这些词，就升级为二次确认。
#
# 为什么需要：上面 forbidden 那 11 条都是**命令式**写法（rm -rf、drop table），
# 而语音用户说的是「删掉 auth.py」「把表清空」。这种句子会被路由到写代码通道
# （YELLOW，不弹确认），等于一句话就把文件送进一个正在运行的 coding CLI 里执行。
#
# 只作用于 YELLOW：GREEN 工具改不了东西，不该因为「记录：今天删了旧接口」这种
# 措辞被拦——那样人就会习惯性点允许，确认卡也就废了。
# 代价写在 REVIEW §27：写代码时注释里出现「删除」也会多问一次。
[confirm]
'删(掉|除|库|表|文件|了)' = "删除"
'清空' = "清空"
'格式化' = "格式化"
'覆盖(掉|原|文件)' = "覆盖"
'git\s+push' = "推送到远端"
'reset\s+--hard' = "硬重置"
'强(制)?(推送|覆盖|删除)' = "强制改动"

# 工具风险等级。新增工具必须在此登记，否则 tests/test_safety.py 会失败。
[risk]
append_structured_log = "green"
inspect_server_ops = "green"
read_file_head = "green"
search_notes = "green"
open_in_ide = "green"
list_tools = "green"
open_app = "green"
tell_time = "green"
write_code = "yellow"
dispatch_code_session = "yellow"
rollback_file = "yellow"
delegate_to_coding_cli = "red_confirm"

# 角色白名单（"*" 表示全部）。未在白名单内 -> RED_FORBIDDEN。
[roles.DEVELOPER]
allow = ["*"]
draft = false

[roles.OPS]
allow = [
  "append_structured_log", "inspect_server_ops", "read_file_head",
  "search_notes", "open_in_ide", "list_tools",
]
draft = false

[roles.DOCTOR]
allow = ["append_structured_log", "search_notes", "open_in_ide", "list_tools"]
draft = true
