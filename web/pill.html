<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>VoxOS · Ambient Pill</title>
<style>
  :root{
    --pill-bg: rgba(20,20,22,.82);
    --pill-border: rgba(255,255,255,.12);
    --idle:#9CA3AF; --listen:#10B981; --run:#3B82F6; --warn:#F59E0B; --block:#EF4444;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:transparent;overflow:hidden;
    font-family:-apple-system,"SF Pro Text","PingFang SC",system-ui,sans-serif}
  body{display:flex;justify-content:center;align-items:flex-start;padding-top:12px;
    background:linear-gradient(180deg,#f5f6f8,#eceef2)}
  .pill{
    position:relative;display:flex;align-items:center;gap:8px;
    width:180px;height:36px;padding:0 14px;border-radius:18px;
    background:var(--pill-bg);border:1px solid var(--pill-border);
    box-shadow:0 8px 32px rgba(0,0,0,.32);
    -webkit-backdrop-filter:blur(24px) saturate(180%);
    backdrop-filter:blur(24px) saturate(180%);
    color:#F5F5F7;font-size:12.5px;letter-spacing:.01em;
    opacity:0;transform:translateY(-8px);pointer-events:none;
    transition:opacity .15s cubic-bezier(.2,.8,.2,1),transform .15s cubic-bezier(.2,.8,.2,1),
               border-color .2s ease,box-shadow .2s ease;
  }
  .pill.show{opacity:1;transform:translateY(0);pointer-events:auto}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--idle);flex:0 0 auto;
    box-shadow:0 0 0 0 rgba(16,185,129,.5)}
  .label{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    font-variant-numeric:tabular-nums}
  .bars{display:flex;align-items:flex-end;gap:2px;height:12px}
  .bars i{display:block;width:2px;height:3px;border-radius:1px;background:var(--listen);
    opacity:.75;transition:height .12s ease}
  .pill[data-state="listening"] .dot{background:var(--listen);animation:breathe 1.6s ease-in-out infinite}
  .pill[data-state="listening"] .bars i:nth-child(1){animation:bar .9s ease-in-out infinite}
  .pill[data-state="listening"] .bars i:nth-child(2){animation:bar .7s ease-in-out infinite .1s}
  .pill[data-state="listening"] .bars i:nth-child(3){animation:bar 1.1s ease-in-out infinite .2s}
  .pill[data-state="executing"] .dot{background:var(--run);animation:pulse 1s ease-in-out infinite}
  .pill[data-state="executing"]{border-color:rgba(59,130,246,.55)}
  .pill[data-state="done"]{border-color:rgba(16,185,129,.55)}
  .pill[data-state="done"] .dot{background:var(--listen)}
  .pill[data-state="blocked"]{border-color:rgba(239,68,68,.6);box-shadow:0 8px 32px rgba(239,68,68,.22)}
  .pill[data-state="blocked"] .dot{background:var(--block)}
  .pill[data-state="confirm"]{border-color:rgba(245,158,11,.65);box-shadow:0 8px 32px rgba(245,158,11,.22)}
  .pill[data-state="confirm"] .dot{background:var(--warn);animation:pulse 1.2s ease-in-out infinite}
  .cmd{position:absolute;inset:0;opacity:0;border:0;border-radius:18px;padding:0 14px;
    background:rgba(0,0,0,.55);color:#fff;font-size:12.5px;outline:none;transition:opacity .12s}
  .pill.typing .cmd{opacity:1}
  @keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.45);opacity:1}
    50%{box-shadow:0 0 0 6px rgba(16,185,129,0);opacity:.65}}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.72);opacity:.6}}
  @keyframes bar{0%,100%{height:3px}50%{height:11px}}
  @media (prefers-reduced-motion: reduce){
    .dot,.bars i{animation:none!important}
    .pill{transition:opacity .01ms,transform .01ms}
  }
  .hint{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);
    font-size:11px;color:#9aa0aa}
</style>
</head>
<body>
  <div class="pill" id="pill" data-state="idle" title="点击输入文字指令">
    <span class="dot"></span>
    <span class="label" id="label">聆听中</span>
    <span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>
    <input class="cmd" id="cmd" placeholder="输入指令后回车…" autocomplete="off" />
  </div>
  <div class="hint">VoxOS · 语音优先，无窗口</div>

<script>
const pill = document.getElementById('pill');
const label = document.getElementById('label');
const cmd = document.getElementById('cmd');
let hideTimer = null;

function render(ev){
  if(!ev || ev.state === 'ping') return;
  const text = {idle:'', listening:'聆听中', executing:'执行中', done:'完成',
                blocked:'已拦截', confirm:'需要确认'}[ev.state] || ev.state;
  pill.dataset.state = ev.state;
  label.textContent = ev.label || text;
  if(ev.state === 'idle'){ hide(); return; }
  pill.classList.add('show');
  clearTimeout(hideTimer);
  if(['done','blocked','confirm'].includes(ev.state)){
    hideTimer = setTimeout(hide, ev.state === 'confirm' ? 8000 : 2400);
  }
}
function hide(){ pill.classList.remove('show'); }

const es = new EventSource('/events');
es.onmessage = e => { try{ render(JSON.parse(e.data).last || JSON.parse(e.data)); }catch(_){} };
es.onerror = () => { hide(); };

pill.addEventListener('click', e => {
  if(e.target === cmd) return;
  pill.classList.add('typing'); cmd.focus();
});
cmd.addEventListener('blur', () => pill.classList.remove('typing'));
cmd.addEventListener('keydown', async e => {
  if(e.key !== 'Enter' || !cmd.value.trim()) return;
  const text = cmd.value.trim(); cmd.value = '';
  pill.classList.remove('typing'); cmd.blur();
  render({state:'executing', label:'处理中…'});
  try{
    const r = await fetch('/command', {method:'POST', body:text});
    const data = await r.json();
    render({state:'done', label:data.reply || '完成'});
  }catch(_){ render({state:'blocked', label:'服务不可达'}); }
});
fetch('/state').then(r=>r.json()).then(s=>{ if(s.last) render(s.last); }).catch(()=>{});
</script>
</body>
</html>
