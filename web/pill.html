<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>VoxOS · Ambient Pill</title>
<style>
  :root{
    --ink:#F2F3F5; --muted:#A6ACB6; --dim:#8A9099;
    --line:rgba(255,255,255,.09); --line-soft:rgba(255,255,255,.055);
    --glass:rgba(28,29,33,.92); --glass-pill:rgba(20,20,22,.86);
    --accent:#0A84FF; --ok:#30D158; --warn:#FF9F0A; --bad:#FF453A;
    --radius:20px; --pill-h:36px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* hidden 属性会被 .ask{display:flex} 这类规则盖掉（同一优先级，作者样式胜出），
     所以统一加一条兜底：以后任何元素写 hidden 都真的会消失。 */
  [hidden]{display:none !important}
  html,body{height:100%;margin:0}
  body{
    background:radial-gradient(120% 80% at 50% 0%,#1a1c20 0%,#0e0f11 55%,#0b0c0e 100%);
    color:var(--ink);
    font:13px/1.55 -apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;justify-content:center;align-items:flex-start;
    padding:12px 10px 20px;overflow:hidden;
  }
  .stage{width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;gap:10px}

  /* ---------------- 胶囊 ---------------- */
  .pill{
    position:relative;display:flex;align-items:center;gap:8px;
    height:var(--pill-h);padding:0 10px 0 12px;border-radius:calc(var(--pill-h)/2);
    background:var(--glass-pill);border:1px solid rgba(255,255,255,.12);
    box-shadow:0 8px 32px rgba(0,0,0,.36);
    -webkit-backdrop-filter:blur(24px) saturate(180%);
    backdrop-filter:blur(24px) saturate(180%);
    font-size:12.5px;letter-spacing:.01em;cursor:pointer;user-select:none;
    transition:border-color .2s ease,box-shadow .2s ease,width .2s ease;
    min-width:180px;max-width:340px;
  }
  /* hover 只加投影与内高光：边框留给状态色，否则 done/blocked 会把 hover 盖掉 */
  .pill:hover{box-shadow:0 10px 38px rgba(0,0,0,.5);background:rgba(30,30,33,.92)}
  .pill:active{transform:translateY(.5px)}
  .pill:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:0 0 auto}
  .label{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    font-variant-numeric:tabular-nums;color:var(--ink)}
  .meter{display:flex;align-items:flex-end;gap:2px;height:12px;opacity:0;transition:opacity .2s}
  .meter i{display:block;width:2px;border-radius:1px;background:var(--ok);opacity:.85}
  /* 三根柱子给不同基线高度：静止时也读作电平表，不会像省略号 */
  .meter i:nth-child(1){height:5px}
  .meter i:nth-child(2){height:10px}
  .meter i:nth-child(3){height:7px}
  .gear{width:22px;height:22px;border:0;background:transparent;color:var(--dim);
    display:grid;place-items:center;border-radius:6px;cursor:pointer;padding:0}
  .gear:hover{color:var(--ink);background:rgba(255,255,255,.08)}

  .pill[data-state="listening"] .dot{background:var(--ok);animation:breathe 1.6s ease-in-out infinite}
  .pill[data-state="listening"] .meter{opacity:1}
  .pill[data-state="listening"] .meter i:nth-child(1){animation:bar .9s ease-in-out infinite}
  .pill[data-state="listening"] .meter i:nth-child(2){animation:bar .7s ease-in-out infinite .1s}
  .pill[data-state="listening"] .meter i:nth-child(3){animation:bar 1.1s ease-in-out infinite .2s}
  .pill[data-state="executing"] .dot{background:var(--accent);animation:pulse 1s ease-in-out infinite}
  .pill[data-state="executing"]{border-color:rgba(10,132,255,.5)}
  .pill[data-state="done"]{border-color:rgba(48,209,88,.5)}
  .pill[data-state="done"] .dot{background:var(--ok)}
  .pill[data-state="blocked"]{border-color:rgba(255,69,58,.55);box-shadow:0 8px 32px rgba(255,69,58,.18)}
  .pill[data-state="blocked"] .dot{background:var(--bad)}
  .pill[data-state="confirm"]{border-color:rgba(255,159,10,.6);box-shadow:0 8px 32px rgba(255,159,10,.18)}
  .pill[data-state="confirm"] .dot{background:var(--warn);animation:pulse 1.2s ease-in-out infinite}
  .pill[data-state="onboard"] .dot{background:var(--warn)}

  /* ---------------- 面板 ---------------- */
  .panel{
    width:100%;background:var(--glass);border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:0 24px 60px rgba(0,0,0,.5);
    -webkit-backdrop-filter:blur(30px) saturate(180%);
    backdrop-filter:blur(30px) saturate(180%);
    overflow:hidden;transform-origin:top center;
    animation:drop .18s cubic-bezier(.2,.8,.2,1);
    max-height:calc(100vh - 70px);display:flex;flex-direction:column;
  }
  .panel[hidden]{display:none}
  /* 确认卡在面板下方。胶囊窗口只有 420×620，面板吃满高度时卡片会被挤出屏幕——
     而它是限时 8 秒的，必须始终可见。有卡片时把面板压矮。 */
  .stage:has(.confirm:not([hidden])) .panel{max-height:calc(100vh - 200px)}
  @keyframes drop{from{opacity:0;transform:translateY(-6px) scale(.985)}to{opacity:1;transform:none}}

  .head{display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
  .head h1{font-size:15px;font-weight:600;margin:0;letter-spacing:-.01em}
  .head .meta{color:var(--dim);font-size:11px;margin-left:auto;font-variant-numeric:tabular-nums}
  .close{width:24px;height:24px;border:0;background:rgba(255,255,255,.07);color:var(--muted);
    border-radius:50%;cursor:pointer;display:grid;place-items:center;font-size:11px;line-height:1}
  .close:hover{background:rgba(255,255,255,.14);color:var(--ink)}

  .tabs{display:flex;gap:2px;margin:2px 16px 0;background:rgba(255,255,255,.06);
    padding:2px;border-radius:9px}
  .tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;
    font-size:12px;padding:5px 0;border-radius:7px;cursor:pointer;transition:.15s}
  .tabs button[aria-selected="true"]{background:rgba(255,255,255,.12);color:var(--ink);
    box-shadow:0 1px 2px rgba(0,0,0,.25)}
  .tabs button .mark{display:none;width:5px;height:5px;border-radius:50%;
    background:var(--warn);margin-left:5px;vertical-align:1.5px}
  .tabs button.dirty .mark{display:inline-block}

  /* 底部留白放在 .view 上，不放在滚动容器上：滚动容器一旦有下内边距，
     sticky 的保存条只能贴到内容盒底，那 16px 会露出一条正在滚的内容。 */
  .body{padding:14px 16px 0;overflow-y:auto;overscroll-behavior:contain}
  .view{padding-bottom:16px}
  .body::-webkit-scrollbar{width:8px}
  .body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:4px}
  .view[hidden]{display:none}

  /* 状态 */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .cell{background:rgba(255,255,255,.045);border:1px solid var(--line-soft);
    border-radius:12px;padding:10px 12px}
  .cell .k{color:var(--dim);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
  .cell .v{font-size:15px;margin-top:3px;font-variant-numeric:tabular-nums}
  .cell .v.ok{color:var(--ok)}
  .cell .v.warn{color:var(--warn)}
  .cell .v small{font-size:11px;color:var(--muted);margin-left:3px}
  .ask{display:flex;gap:8px;margin-top:12px}
  .ask input{flex:1;background:rgba(255,255,255,.06);border:1px solid var(--line);
    border-radius:10px;padding:9px 12px;color:var(--ink);font:inherit;font-size:12.5px;outline:none}
  .ask input:focus{border-color:var(--accent);background:rgba(10,132,255,.08)}
  .ask button{background:var(--accent);border:0;color:#fff;border-radius:10px;padding:0 14px;
    font:inherit;font-size:12.5px;font-weight:500;cursor:pointer}
  .ask button:hover{filter:brightness(1.1)}
  .hint{margin-top:10px;color:var(--dim);font-size:11.5px;line-height:1.6}

  /* 最近 */
  .row{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft)}
  .row:last-child{border-bottom:0}
  .row .t{color:var(--dim);font-size:11px;font-variant-numeric:tabular-nums;padding-top:2px}
  .row .c{flex:1;min-width:0}
  /* 文本单独负责省略号，路由标签永远完整显示（窄面板下曾被裁掉半个标签） */
  .row .q{font-size:12.5px;display:flex;align-items:center;gap:6px}
  .row .q .txt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .a{color:var(--muted);font-size:11.5px;margin-top:1px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .tag{font-size:9.5px;padding:1px 5px;border-radius:4px;background:rgba(255,255,255,.1);
    color:var(--muted);letter-spacing:.02em;flex:0 0 auto;white-space:nowrap}
  .tag.fast{background:rgba(48,209,88,.14);color:#5FDD7E}
  .tag.llm{background:rgba(10,132,255,.16);color:#63B0FF}
  .tag.offline{background:rgba(255,255,255,.09);color:var(--muted)}
  .tag.ignore{background:rgba(255,159,10,.14);color:#FFB84D}
  .empty{color:var(--dim);font-size:12px;text-align:center;padding:26px 0}

  /* 设置 */
  .group{margin-bottom:6px}
  .group h2{font-size:11px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;
    margin:14px 0 4px;font-weight:600}
  .group:first-child h2{margin-top:2px}
  .field{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-soft)}
  .field:last-child{border-bottom:0}
  .field .l{flex:1;min-width:0}
  .field .n{font-size:12.5px}
  .field .h{color:var(--dim);font-size:11.5px;margin-top:3px;line-height:1.55}
  .field .h.warn{color:var(--warn)}
  .field input[type=text],.field input[type=password],.field input[type=number],.field select{
    background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:8px;
    color:var(--ink);font:inherit;font-size:12px;padding:6px 9px;outline:none;width:132px}
  .field input[type=number]{width:66px;text-align:right;font-variant-numeric:tabular-nums}
  .field input:focus,.field select:focus{border-color:var(--accent)}
  .field.wide{display:block}
  .field.wide input{width:100%;margin-top:6px}
  .switch{position:relative;width:38px;height:22px;flex:0 0 auto;cursor:pointer}
  .switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
  .track{position:absolute;inset:0;border-radius:11px;background:rgba(255,255,255,.14);
    transition:background .18s}
  .knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
    background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.4);transition:transform .18s}
  .switch input:checked + .track{background:var(--ok)}
  .switch input:checked + .track .knob{transform:translateX(16px)}
  .switch input:focus-visible + .track{outline:2px solid var(--accent);outline-offset:2px}
  .range{display:flex;align-items:center;gap:8px;flex:0 0 202px;min-width:0}
  .range input[type=range]{flex:1 1 70px;min-width:56px;accent-color:var(--accent);margin:0}
  .range small{color:var(--dim);font-size:11px;margin-left:-4px}

  /* 保存条钉在面板底部：20 个字段滚到中段也能看见「有未保存的改动」。
     bottom 用 0 而不是负 padding：滚到底时它就落回原位，不会压住最后一栏。 */
  .actions{display:flex;gap:8px;position:sticky;bottom:0;margin:12px -16px -16px;
    padding:12px 16px;border-top:1px solid var(--line-soft);
    background:linear-gradient(to top,rgba(28,29,33,.99) 62%,rgba(28,29,33,.9))}
  .btn{flex:1;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);
    border-radius:10px;padding:9px 0;font:inherit;font-size:12.5px;cursor:pointer;transition:.15s}
  .btn:hover{background:rgba(255,255,255,.11)}
  .btn.primary{background:var(--accent);border-color:transparent;color:#fff;font-weight:500}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn:disabled{opacity:.45;cursor:default}
  /* 三个按钮时次要按钮收窄，把宽度让给「保存」——它才是这一栏的主语 */
  .btn.sec{flex:0 0 auto;padding:9px 16px}

  /* 确认卡 */
  .confirm{width:100%;margin-top:2px;background:rgba(255,159,10,.1);border:1px solid rgba(255,159,10,.35);
    border-radius:14px;padding:12px 14px;animation:drop .18s cubic-bezier(.2,.8,.2,1);
    overflow:hidden;position:relative}
  .confirm[hidden]{display:none}
  .confirm .q{font-size:12.5px;line-height:1.5}
  .confirm .a{display:flex;gap:8px;margin-top:10px}
  .confirm .btn{flex:1;padding:7px 0;font-size:12px}
  /* 倒计时：闸门到点就按拒绝处理，界面必须让人看见还剩多久 */
  .confirm .left{position:absolute;left:0;bottom:0;height:2px;background:var(--warn);
    animation:drain linear forwards}
  @keyframes drain{from{width:100%}to{width:0}}

  /* 引导卡 */
  .onboard{margin-top:10px;background:rgba(10,132,255,.1);border:1px solid rgba(10,132,255,.32);
    border-radius:14px;padding:12px 14px}
  .onboard[hidden]{display:none}
  .onboard p{margin:0 0 10px;font-size:12px;color:var(--muted);line-height:1.6}
  /* 卡片里的按钮不参与 flex 均分，得自己撑出左右内边距，否则字贴着边被裁 */
  .onboard .btn{flex:0 0 auto;padding:9px 20px;width:auto}

  .toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,8px);opacity:0;
    background:rgba(40,41,45,.96);border:1px solid var(--line);color:var(--ink);
    padding:8px 14px;border-radius:10px;font-size:12px;pointer-events:none;
    transition:opacity .2s,transform .2s;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(48,209,88,.45);opacity:1}
    50%{box-shadow:0 0 0 6px rgba(48,209,88,0);opacity:.65}}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.72);opacity:.6}}
  @keyframes bar{0%,100%{height:3px}50%{height:11px}}
  @media (prefers-reduced-motion: reduce){
    .dot,.meter i{animation:none!important}
    .panel,.confirm{animation:none}
    *{transition-duration:.01ms!important}
  }
</style>
</head>
<body>
<div class="stage">
  <div class="pill" id="pill" data-state="idle" role="button" tabindex="0"
       aria-expanded="false" aria-controls="panel" title="点击展开控制面板">
    <span class="dot"></span>
    <span class="label" id="label" aria-live="polite">待机</span>
    <span class="meter" aria-hidden="true"><i></i><i></i><i></i></span>
    <button class="gear" id="gear" title="设置" aria-label="设置">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.56-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.56V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.56 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"></path>
      </svg>
    </button>
  </div>

  <section class="panel" id="panel" hidden aria-label="VoxOS 控制面板">
    <div class="head">
      <h1>VoxOS</h1>
      <span class="meta" id="uptime">—</span>
      <button class="close" id="close" aria-label="收起">✕</button>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="status" aria-selected="true">状态</button>
      <button role="tab" data-tab="recent" aria-selected="false">最近</button>
      <button role="tab" data-tab="settings" aria-selected="false">设置<span class="mark"></span></button>
    </div>
    <div class="body">
      <div class="view" data-view="status">
        <div class="grid" id="cells"></div>
        <div class="onboard" id="onboard" hidden>
          <p>还没有声纹档案。录 3 秒，之后只有你的声音能驱动它。</p>
          <button class="btn primary" id="enroll">录入声纹</button>
        </div>
        <div class="ask" id="ask-row">
          <input id="ask" placeholder="说一句话，或在这里输入…" autocomplete="off" />
          <button id="send">发送</button>
        </div>
        <div class="hint" id="hint">点胶囊展开，Esc 收起。危险操作会在这里等你确认。</div>
      </div>

      <div class="view" data-view="recent" hidden>
        <div id="recent"></div>
      </div>

      <div class="view" data-view="settings" hidden>
        <div id="groups"></div>
        <div class="hint">改动立即生效；标注「重启生效」的项需要重开守护进程。</div>
        <div class="actions" id="actions">
          <button class="btn" id="undo" hidden title="撤销上一次保存，配置退回保存前的样子">撤销保存</button>
          <button class="btn" id="reset" disabled title="放弃没保存的改动，重新读当前配置">放弃改动</button>
          <button class="btn primary" id="save" disabled>保存</button>
        </div>
      </div>
    </div>
  </section>

  <div class="confirm" id="confirm" hidden>
    <div class="q" id="confirm-q">需要确认</div>
    <div class="a">
      <button class="btn" data-allow="0">拒绝</button>
      <button class="btn primary" data-allow="1">允许</button>
    </div>
    <i class="left" id="confirm-left"></i>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const TOKEN = "__VOXOS_TOKEN__";
const $ = id => document.getElementById(id);
const pill = $('pill'), panel = $('panel'), label = $('label');

const STATE_TEXT = {
  idle:'待机', listening:'聆听中', executing:'执行中', done:'完成',
  blocked:'已拦截', confirm:'需要确认', onboard:'待设置'
};
let current = 'idle', settingsCache = null, dirty = {}, confirmTimeout = 8, pendingConfirmId = '';
const ROUTE = {fast:'快通道', offline:'离线兜底', llm:'大模型', ignore:'未识别'};

/* ---------------- 通信 ---------------- */
async function api(path, options = {}) {
  const headers = Object.assign({'X-VoxOS-Token': TOKEN}, options.headers || {});
  if (options.body) headers['Content-Type'] = 'application/json';
  const response = await fetch(path, Object.assign({}, options, {headers}));
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error || (data.errors || []).join('；') || '请求失败');
  return data;
}

function toast(text, bad) {
  const el = $('toast');
  el.textContent = text;
  el.style.borderColor = bad ? 'rgba(255,69,58,.5)' : 'rgba(255,255,255,.09)';
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2200);
}

/* ---------------- 面板 ---------------- */
function open(tab) {
  panel.hidden = false;
  pill.setAttribute('aria-expanded', 'true');
  if (tab) switchTab(tab);
}
function close() {
  panel.hidden = true;
  pill.setAttribute('aria-expanded', 'false');
}
function toggle() { panel.hidden ? open() : close(); }

function switchTab(name) {
  document.querySelectorAll('.tabs button').forEach(b =>
    b.setAttribute('aria-selected', String(b.dataset.tab === name)));
  document.querySelectorAll('.view').forEach(v => { v.hidden = v.dataset.view !== name; });
  if (name === 'recent') loadRecent();
  if (name === 'settings' && !settingsCache) loadSettings();
}

pill.addEventListener('click', e => { if (e.target.closest('.gear')) return; toggle(); });
pill.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
});
$('gear').addEventListener('click', e => { e.stopPropagation(); open('settings'); });
$('close').addEventListener('click', close);
document.querySelectorAll('.tabs button').forEach(b =>
  b.addEventListener('click', () => switchTab(b.dataset.tab)));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') close();
  if ((e.metaKey || e.ctrlKey) && e.key === ',') { e.preventDefault(); open('settings'); }
});

/* ---------------- 状态渲染 ---------------- */
function render(event) {
  if (!event || event.state === 'ping') return;
  const state = event.state;
  current = state;
  pill.dataset.state = state;
  label.textContent = event.label || STATE_TEXT[state] || state;
  if (state === 'confirm') {
    $('confirm-q').textContent = event.detail || '这个操作需要你确认';
    pendingConfirmId = event.request || '';   // 回答必须带回这张卡的请求 ID
    $('confirm').hidden = false;
    startCountdown();
    open();
  } else if (state === 'onboard') {
    setOnboard(true);
    open('status');
    loadStatus();
  } else {
    $('confirm').hidden = true;
  }
  if (state === 'done' || state === 'blocked') loadStatus();
}

/* 闸门到点就按拒绝处理：让倒计时可见，别让人以为卡片是凭空消失的 */
function startCountdown() {
  const bar = $('confirm-left');
  bar.style.animation = 'none';
  void bar.offsetWidth;                       // 强制回流，重启动画
  bar.style.animation = `drain ${confirmTimeout}s linear forwards`;
}

document.querySelectorAll('[data-allow]').forEach(button =>
  button.addEventListener('click', async () => {
    const allow = button.dataset.allow === '1';
    const id = pendingConfirmId;
    pendingConfirmId = '';
    $('confirm').hidden = true;
    try { await api('/api/confirm', {method:'POST', body: JSON.stringify({allow, id})}); }
    catch (error) { toast(error.message, true); }
  }));

/* ---------------- 状态卡 ---------------- */
async function loadStatus() {
  try {
    const status = await api('/api/status');
    const rows = [
      ['声纹', status.enrolled ? '已录入' : '未录入', status.enrolled ? 'ok' : 'warn'],
      ['阈值', status.threshold == null ? '—' : Number(status.threshold).toFixed(2), ''],
      ['角色', status.role || '—', ''],
      ['识别', status.stt || '—', ''],
      ['大模型', status.llm ? '已启用' : '离线', status.llm ? 'ok' : ''],
      ['演练模式', status.dry_run ? '开启' : '关闭', status.dry_run ? 'warn' : ''],
    ];
    $('cells').innerHTML = rows.map(([k, v, tone]) =>
      `<div class="cell"><div class="k">${k}</div><div class="v ${tone}">${v}</div></div>`).join('');
    $('uptime').textContent = `v${status.version} · ${Math.floor((status.uptime_s || 0) / 60)} 分钟`;
    if (status.confirm_timeout_s) confirmTimeout = status.confirm_timeout_s;
    setOnboard(!status.enrolled);
  } catch (_) { /* 守护进程没起来时静默 */ }
}

/* 待录入时输入框是死的：藏起来，把「录 3 秒」顶到第一眼能看到的位置 */
function setOnboard(on) {
  $('onboard').hidden = !on;
  $('ask-row').hidden = on;
  $('hint').textContent = on
    ? '录完声纹，胶囊就会开始听你说话。'
    : '点胶囊展开，Esc 收起。危险操作会在这里等你确认。';
}

async function loadRecent() {
  const box = $('recent');
  try {
    const rows = await api('/api/history');
    if (!rows.length) { box.innerHTML = '<div class="empty">还没有记录。说一句话试试。</div>'; return; }
    box.innerHTML = rows.map(row => `
      <div class="row">
        <span class="t">${row.ts || ''}</span>
        <div class="c">
          <div class="q">
            <span class="txt">${escapeHtml(row.text || '')}</span>
            <span class="tag ${row.route || ''}">${ROUTE[row.route] || row.route || ''}</span>
          </div>
          <div class="a">${escapeHtml(row.reply || '没听懂，什么也没做')}</div>
        </div>
      </div>`).join('');
  } catch (error) { box.innerHTML = `<div class="empty">${error.message}</div>`; }
}

function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------------- 设置 ---------------- */
async function loadSettings() {
  try {
    const data = await api('/api/settings');
    settingsCache = data.groups;
    dirty = {};
    $('groups').innerHTML = data.groups.map(group => `
      <div class="group"><h2>${group.label}</h2>
        ${group.fields.map(field => fieldHtml(field)).join('')}
      </div>`).join('');
    bindFields();
    markDirty();
    setUndo(data.undo);
  } catch (error) { toast(error.message, true); }
}

/* 撤销只退一步：有备份才出现，退完就消失。没有可退的步骤时不留一个灰按钮在那儿。 */
function setUndo(available) {
  $('undo').hidden = !available;
  $('undo').classList.toggle('sec', !!available);
  $('reset').classList.toggle('sec', !!available);
  if (!available) disarmUndo();
}

function fieldHtml(field) {
  const id = `f-${field.key.replace('.', '-')}`;
  const over = field.overridden_by
    ? `<div class="h warn">被环境变量 ${field.overridden_by} 覆盖，这里改不动</div>` : '';
  const help = field.help ? `<div class="h">${field.help}</div>` : '';
  const disabled = field.overridden_by ? 'disabled' : '';
  const wrap = (control, wide) => `
    <div class="field${wide ? ' wide' : ''}">
      <div class="l"><div class="n">${field.label}${field.restart ? '<span class="tag">重启生效</span>' : ''}</div>${help}${over}</div>
      ${control}
    </div>`;

  if (field.kind === 'bool') {
    return wrap(`<label class="switch"><input type="checkbox" id="${id}" data-key="${field.key}"
      ${field.value ? 'checked' : ''} ${disabled}><span class="track"><span class="knob"></span></span></label>`);
  }
  if (field.kind === 'enum') {
    const options = field.options.map(o =>
      `<option ${o === field.value ? 'selected' : ''}>${o}</option>`).join('');
    return wrap(`<select id="${id}" data-key="${field.key}" ${disabled}>${options}</select>`);
  }
  if (field.kind === 'int' || field.kind === 'float') {
    const step = field.step || 1;
    const unit = field.unit ? `<small style="color:var(--dim)">${field.unit}</small>` : '';
    return wrap(`<div class="range">
      <input type="range" id="${id}-r" data-key="${field.key}" min="${field.min}" max="${field.max}"
             step="${step}" value="${field.value}" ${disabled}>
      <input type="number" id="${id}" data-key="${field.key}" min="${field.min}" max="${field.max}"
             step="${step}" value="${field.value}" ${disabled}>${unit}</div>`);
  }
  return wrap(`<input type="${field.secret ? 'password' : 'text'}" id="${id}" data-key="${field.key}"
    value="${field.value == null ? '' : escapeHtml(field.value)}" ${disabled}>`, true);
}

function bindFields() {
  document.querySelectorAll('[data-key]').forEach(input => {
    const key = input.dataset.key;
    const sync = value => { dirty[key] = value; markDirty(); };
    input.addEventListener('input', () => {
      sync(input.type === 'checkbox' ? input.checked
        : input.type === 'number' || input.type === 'range' ? Number(input.value)
        : input.value);
      const twin = document.getElementById(`${input.id}-r`);
      if (twin && input.type === 'number') twin.value = input.value;
      if (twin && input.type === 'range') document.getElementById(input.id.replace('-r', '')).value = input.value;
    });
    input.addEventListener('change', () => input.dispatchEvent(new Event('input')));
  });
}

/* 保存条在滚动区里，改一个开关就可能滚出视野——页签上点个点，保存按钮跟着亮。
   「放弃改动」只在真的有改动时可用：没改的时候它无事可做，亮着只会让人点。 */
function markDirty() {
  const pending = Object.keys(dirty).length > 0;
  $('save').disabled = !pending;
  $('reset').disabled = !pending;
  document.querySelector('[data-tab="settings"]').classList.toggle('dirty', pending);
}

$('save').addEventListener('click', async () => {
  if (!Object.keys(dirty).length) { toast('没有改动'); return; }
  $('save').disabled = true;
  try {
    const result = await api('/api/settings', {method:'POST', body: JSON.stringify({values: dirty})});
    toast('已保存');
    settingsCache = result.groups || null;
    dirty = {};
    await loadSettings();
    await loadStatus();
  } catch (error) { toast(error.message, true); }
  finally { markDirty(); }
});

$('reset').addEventListener('click', () => { settingsCache = null; dirty = {}; loadSettings(); });

/* 撤销不可逆（退完这一步就没了），所以要点两下：第一下把按钮变成「确认撤销」，
   三秒不动自己变回来。比弹系统对话框轻，也比一点就退安全。 */
let undoArmed = 0;
function disarmUndo() {
  clearTimeout(undoArmed);
  undoArmed = 0;
  $('undo').textContent = '撤销保存';
}

$('undo').addEventListener('click', async () => {
  if (!undoArmed) {
    $('undo').textContent = '确认撤销';
    undoArmed = setTimeout(disarmUndo, 3000);
    return;
  }
  disarmUndo();
  $('undo').disabled = true;
  try {
    await api('/api/settings/undo', {method:'POST', body:'{}'});
    toast('已撤销上一次保存');
    settingsCache = null; dirty = {};
    await loadSettings();
    await loadStatus();
  } catch (error) { toast(error.message, true); }
  finally { $('undo').disabled = false; }
});

/* ---------------- 指令与录入 ---------------- */
async function send() {
  const input = $('ask');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  render({state:'executing', label:'处理中…'});
  try {
    const data = await api('/command', {method:'POST', body: JSON.stringify({text})});
    render({state:'done', label: data.reply || '完成'});
    loadRecent();
  } catch (error) {
    render({state:'blocked', label: error.message});
  }
}
$('send').addEventListener('click', send);
$('ask').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

$('enroll').addEventListener('click', async () => {
  const button = $('enroll');
  button.disabled = true;
  button.textContent = '请说 3 句话（句间停半秒）';
  try {
    const result = await api('/api/enroll', {method:'POST', body: JSON.stringify({seconds: 10})});
    toast(result.warning || `录入完成：${result.samples} 句，一致性 ${result.consistency}`);
    setOnboard(false);
    await loadStatus();
  } catch (error) {
    toast(error.message, true);
  } finally { button.disabled = false; button.textContent = '录入声纹'; }
});

/* ---------------- 启动 ---------------- */
const PARAMS = new URLSearchParams(location.search);
const STILL = PARAMS.has('still');     // 静态模式：不连 SSE，供截图/文档使用
if (!STILL) {
  const stream = new EventSource(`/events?t=${encodeURIComponent(TOKEN)}`);
  stream.onmessage = event => {
    try {
      const payload = JSON.parse(event.data);
      render(payload.last || payload);
    } catch (_) { /* 忽略坏帧 */ }
  };
  stream.onerror = () => { label.textContent = '服务已断开'; pill.dataset.state = 'blocked'; };
}

api('/state').then(state => { if (state.last) render(state.last); }).catch(() => {});
loadStatus();
if (PARAMS.get('panel')) open(PARAMS.get('panel'));
else if (location.pathname.startsWith('/settings')) open('settings');
if (!STILL) setInterval(loadStatus, 15000);
</script>
</body>
</html>
