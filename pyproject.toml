[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "voxos"
version = "0.1.28"
description = "只听你一个人说话的语音操作系统 Agent：本地声纹锁 + 快慢双通道路由 + 极简胶囊"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
audio = ["sounddevice>=0.4.6"]
# `models` 故意**带上** sounddevice：只有识别引擎、没有麦克风是个没人想要的组合
# （sherpa-onnx 装上了也听不到声音），而它恰好是「我想要真识别」的人最容易写下的
# 那一条。实测踩过：`pipx install "voxos[models]"` 之后 App 一开就是
# 「音频设备异常」。分开装不是自由，是陷阱。
models = ["sherpa-onnx>=1.10", "onnxruntime>=1.17", "sounddevice>=0.4.6"]
local-stt = ["faster-whisper>=1.0"]
dev = ["pytest>=8", "build>=1.2"]

[project.scripts]
voxos = "voxos.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# 运行资源不在 src 包里：不声明它们，普通安装会缺默认配置、红线策略和胶囊页面。
[tool.setuptools.data-files]
"share/voxos/config" = ["config/settings.toml", "config/redlines.toml"]
# 提示词也是运行资源：漏了不会报错，只会静默退回代码里那份 DEFAULT_DISPATCH——
# 本机（源码布局）测不出来，装完才发现自己改的文件没人读。
"share/voxos/config/prompts" = [
    "config/prompts/dispatch.md",
    "config/prompts/developer.md",
    "config/prompts/ops.md",
    "config/prompts/doctor.md",
]
"share/voxos/web" = ["web/pill.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
