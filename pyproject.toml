[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voxos"
version = "0.1.0"
description = "只听你一个人说话的语音操作系统 Agent：本地声纹锁 + 快慢双通道路由 + 极简胶囊"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
audio = ["sounddevice>=0.4.6"]
models = ["sherpa-onnx>=1.10", "onnxruntime>=1.17"]
local-stt = ["faster-whisper>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
voxos = "voxos.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
