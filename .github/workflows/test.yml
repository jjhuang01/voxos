name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 安装最小依赖
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
      - name: 最小依赖测试（缺可选依赖时必须优雅降级）
        run: python -m pytest -q
      - name: 安装完整依赖
        run: python -m pip install -e ".[dev,models,audio]"
      - name: 完整依赖测试
        run: python -m pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - name: 构建 wheel 与 sdist
        run: python -m build
      - name: 脱离源码目录做安装冒烟
        run: |
          python -m venv /tmp/voxos-smoke
          /tmp/voxos-smoke/bin/pip install dist/*.whl
          cd /tmp
          /tmp/voxos-smoke/bin/voxos tools
          /tmp/voxos-smoke/bin/python -c "from voxos.config import load; c=load(); assert c.get('audio.chunk_size')"

  # 产物走 release 资产，不走 upload-artifact：免费额度的 artifact 存储会被占满
  # （本项目第一次跑 CI 就撞上了），而 release 资产不占那个配额，也不会 90 天过期。
  # 代价是 release job 自己再构建一次——几秒钟，换掉一类长期的配额故障。
  release:
    needs: [test, package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - name: 重新构建（可重复构建是前提）
        run: python -m build
      - name: 发布到 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$VERSION" \
            --notes "安装：pipx install voxos-${VERSION#v}-py3-none-any.whl" \
            --verify-tag
